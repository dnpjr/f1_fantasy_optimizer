name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python -m compileall -q f1fantasy scripts tests streamlit_app.py
      - name: Audit Sprint maintenance inputs
        shell: bash
        run: |
          set +e
          python scripts/update_sprint_model.py --audit
          audit_status=$?
          set -e
          if [ "$audit_status" -eq 2 ]; then
            echo "::notice::Sprint maintenance audit is awaiting official source snapshots; no candidate was generated."
            exit 0
          fi
          exit "$audit_status"
